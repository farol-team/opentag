# Slack App Manifest for OpenTag — production (app id A0BP0QCBCMN).
#
# Events go DIRECTLY to the cloud VM (opentag-hooks.farol.team, caddy TLS): the
# Yandex API Gateway strips Slack signature headers, so events cannot
# pass through opentag.farol.team. OAuth redirects are browser redirects
# (query params) and stay on the SaaS domain.
#
# Applying this REPLACES the whole app configuration — anything set by hand in
# api.slack.com and missing here is removed. Keep `oauth_config.scopes.bot` in
# lockstep with `SLACK_SCOPES` in app/api/slack-oauth.ts (a test enforces it),
# and remember that widening scopes does not reach installed workspaces: Slack
# grants scopes at install time, so each workspace must reinstall.
display_information:
  name: OpenTag
  description: Mention the bot, and the coding agent on your own machine does the work.
  background_color: "#590088"
  long_description: >-
    OpenTag turns a Slack mention into work on a real machine — yours.


    Mention the bot in any thread and the task goes to the coding agent already
    running on your laptop: Claude Code, Codex, OpenCode, Cursor, whichever one
    you use. The answer streams back into the thread as it is written, with the
    step it is on underneath, and Approve / Deny / Stop buttons whenever the
    agent wants to do something it should not do unasked. Reply in the thread
    like you would to a colleague and the same session picks up where it left
    off — no new mention, no re-explaining.


    Your code never leaves your machine. The runner is a thin tray app that
    dials out to us: no open ports, no repository upload, no keys of yours on
    our servers. It works only inside folders you have opened to it, and every
    destructive step is a button in the thread rather than a surprise in your
    git history.


    The bot also remembers. Every channel it is invited to becomes part of your
    team's memory, and an agent answering in a channel may read exactly that
    channel's memory — the boundary Slack already draws — so a public answer
    never quotes a room you are not in.


    Bring your own agent, keep your own machine, and let the thread be the
    interface.
features:
  bot_user:
    display_name: opentag
    always_online: true
oauth_config:
  redirect_urls:
    - https://opentag.farol.team/api/slack/callback
    - https://opentag.farol.team/api/oauth/callback
  scopes:
    user:
      # Sign-in only. The agent never acts as a human and never reads with
      # a human's eyes: memory is scoped to the channel that asked, so a
      # person-scoped grant would have nothing to attach to but risk.
      - openid
      - profile
      - email
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - bookmarks:write
      - canvases:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - chat:write.customize
      - commands
      - emoji:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - pins:read
      - pins:write
      - reactions:read
      - reactions:write
      - search:read.public
      - team:read
      - usergroups:read
      - users.profile:read
      - users:read
      - users:read.email
settings:
  # Approve/Deny/Stop are buttons: without this, Slack delivers the click
  # nowhere and the agent waits for an answer that cannot arrive. Bolt takes
  # interactions on the same endpoint as events.
  interactivity:
    is_enabled: true
    request_url: https://opentag-hooks.farol.team/slack/events
  event_subscriptions:
    request_url: https://opentag-hooks.farol.team/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups    # private channels are archived too
      - message.im
      - message.mpim      # a group DM is a conversation, not an archive
      - file_deleted      # deleting in Slack removes the copy in memory
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
