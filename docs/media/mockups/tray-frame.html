<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenTag Runner — tray window</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { padding: 28px; font-family: Inter, system-ui, sans-serif; }
  .window { width: 400px; border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 18px 50px rgba(16,12,24,.22), 0 2px 6px rgba(16,12,24,.1); }
  .chrome { height: 32px; background: #f4f4f5; border-bottom: 1px solid #e4e4e7;
    display: flex; align-items: center; padding: 0 12px; gap: 7px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .t { margin-left: 12px; font-size: 12px; color: #71717a; font-weight: 500; }
  iframe { width: 400px; height: 566px; border: 0; display: block; background: #fff; }
</style>
</head>
<body>
  <div class="window">
    <div class="chrome">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="t">OpenTag Runner</span>
    </div>
    <iframe src="tray-stub.html"></iframe>
  </div>
</body>
</html>
