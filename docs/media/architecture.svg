<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620"
     font-family="Inter, -apple-system, Segoe UI, sans-serif" role="img"
     aria-label="OpenTag architecture: Slack talks to the cloud, the cloud routes a turn over an outbound WebSocket to a runner on a developer's machine, the runner drives a local coding agent over ACP, and team memory lives in OpenViking behind a channel-scoped gateway.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#52525b"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7c3aed"/>
    </marker>
  </defs>

  <style>
    .card  { fill: #ffffff; stroke: #d4d4d8; stroke-width: 1.5; }
    .zone  { fill: #fafafa; stroke: #a1a1aa; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .inner { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1.2; }
    .t     { fill: #18181b; font-size: 14px; font-weight: 600; }
    .s     { fill: #3f3f46; font-size: 12.5px; }
    .m     { fill: #71717a; font-size: 11.5px; }
    .zt    { fill: #71717a; font-size: 11.5px; font-weight: 600; letter-spacing: .4px; }
    .lbl   { fill: #52525b; font-size: 11.5px; }
    .lblp  { fill: #7c3aed; font-size: 11.5px; font-weight: 600; }
    .ln    { stroke: #52525b; stroke-width: 1.6; fill: none; }
    .lnp   { stroke: #7c3aed; stroke-width: 2; fill: none; }
    .mono  { font-family: "Fira Code", ui-monospace, monospace; font-size: 11px; fill: #71717a; }
  </style>

  <rect x="0" y="0" width="1080" height="620" rx="14" fill="#ffffff"/>

  <!-- ───────────── Slack ───────────── -->
  <rect class="card" x="24" y="120" width="200" height="184" rx="12"/>
  <path d="M24 132a12 12 0 0 1 12-12h176a12 12 0 0 1 12 12v22H24z" fill="#3F0E40"/>
  <text x="40" y="144" fill="#ffffff" font-size="13" font-weight="700">Slack</text>
  <text class="s" x="40" y="182"># eng-payments</text>
  <text class="m" x="40" y="204">@opentag why is checkout 500-ing?</text>
  <text class="m" x="40" y="230">the answer streams into the thread</text>
  <text class="m" x="40" y="252">Approve / Deny / Stop buttons</text>
  <text class="m" x="40" y="274">👀 while it runs, ✅ when it lands</text>

  <!-- ───────────── cloud ───────────── -->
  <rect class="zone" x="316" y="60" width="314" height="330" rx="14"/>
  <text class="zt" x="334" y="86">CLOUD — DATA PLANE (PYTHON / FASTAPI)</text>
  <rect class="inner" x="334" y="100" width="278" height="62" rx="10"/>
  <text class="t" x="350" y="124">Slack Bolt</text>
  <text class="m" x="350" y="145">mentions, buttons, message ingestion</text>
  <rect class="inner" x="334" y="176" width="278" height="76" rx="10"/>
  <text class="t" x="350" y="200">ChatRouter</text>
  <text class="m" x="350" y="221">thread = chat, mention = turn</text>
  <text class="m" x="350" y="240">routes to the author’s own runner</text>
  <rect class="inner" x="334" y="266" width="278" height="76" rx="10"/>
  <text class="t" x="350" y="290">memory gateway</text>
  <text class="mono" x="350" y="311">/memory/mcp</text>
  <text class="m" x="350" y="330">signed token, scoped to one channel</text>

  <!-- ───────────── developer machine ───────────── -->
  <rect class="zone" x="746" y="60" width="310" height="330" rx="14"/>
  <text class="zt" x="764" y="86">YOUR MACHINE — ZERO OPEN PORTS</text>
  <rect class="inner" x="764" y="100" width="274" height="96" rx="10"/>
  <text class="t" x="780" y="124">OpenTag Runner (Rust / Tauri)</text>
  <text class="m" x="780" y="145">tray app · token in the OS keychain</text>
  <text class="m" x="780" y="164">dials the cloud, never listens</text>
  <text class="m" x="780" y="183">directory allowlist · permission relay</text>
  <rect class="inner" x="764" y="248" width="274" height="94" rx="10"/>
  <text class="t" x="780" y="272">Your coding agent</text>
  <text class="m" x="780" y="293">Claude Code · Codex · OpenCode · Cursor</text>
  <text class="mono" x="780" y="313">~/OpenTag/&lt;workspace&gt;/&lt;channel&gt;</text>
  <text class="m" x="780" y="332">your files, your keys, your machine</text>

  <!-- ───────────── SaaS control plane ───────────── -->
  <rect class="card" x="316" y="470" width="314" height="118" rx="12"/>
  <text class="t" x="336" y="498">app/ — SaaS control plane</text>
  <text class="m" x="336" y="520">React + Hono + tRPC, PostgreSQL</text>
  <text class="m" x="336" y="540">workspaces, runners, channels, activity</text>
  <text class="m" x="336" y="560">Slack installs · runner tokens (hashed)</text>

  <!-- ───────────── OpenViking ───────────── -->
  <rect class="card" x="24" y="470" width="200" height="118" rx="12"/>
  <text class="t" x="44" y="498">OpenViking</text>
  <text class="m" x="44" y="520">team memory, one account</text>
  <text class="m" x="44" y="539">per Slack workspace</text>
  <text class="mono" x="44" y="563">slack/{channel}/{date}.md</text>

  <!-- ───────────── edges ───────────── -->
  <!-- Slack ⇄ cloud -->
  <path class="lnp" d="M224 192 H310" marker-end="url(#ap)"/>
  <text class="lblp" x="267" y="182" text-anchor="middle">Events API</text>
  <path class="lnp" d="M316 236 H230" marker-end="url(#ap)"/>
  <text class="lblp" x="267" y="256" text-anchor="middle">edits, 1/sec</text>

  <!-- cloud ⇄ runner -->
  <path class="lnp" d="M630 140 H740" marker-end="url(#ap)"/>
  <text class="lblp" x="688" y="130" text-anchor="middle">assign_turn</text>
  <path class="lnp" d="M746 172 H636" marker-end="url(#ap)"/>
  <text class="lblp" x="688" y="192" text-anchor="middle">turn_event</text>
  <text class="lbl" x="688" y="218" text-anchor="middle">one outbound</text>
  <text class="mono" x="688" y="234" text-anchor="middle">wss /runner/v1</text>

  <!-- runner → agent -->
  <path class="ln" d="M901 196 V242" marker-end="url(#a)"/>
  <text class="lbl" x="915" y="226">ACP over stdio</text>

  <!-- agent → memory gateway -->
  <path class="ln" d="M840 342 V420 H560 V348" marker-end="url(#a)"/>
  <text class="lbl" x="690" y="444">team-memory MCP — this channel’s memory, nothing else</text>

  <!-- cloud → OpenViking -->
  <path class="ln" d="M334 350 Q200 360 150 470" marker-end="url(#a)"/>
  <text class="lbl" x="106" y="418">50 msgs / 5 min</text>

  <!-- cloud ⇄ SaaS -->
  <path class="ln" d="M480 390 V464" marker-end="url(#a)"/>
  <path class="ln" d="M436 464 V390" marker-end="url(#a)"/>
  <text class="lbl" x="494" y="432">tRPC, x-internal-secret</text>
</svg>
